[package]
name = "raea-sys-viewbox"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "The view a camera on the Engine's target draws: the frame above its tag row, or the box a page lays out for it (Engine::set_view_box, #130)"

[dependencies]
raea-sys-compose = { path = "../compose" }
raea-sys-frame = { path = "../frame" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
